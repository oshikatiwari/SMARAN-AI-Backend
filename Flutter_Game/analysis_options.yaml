include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_return: error
    missing_enum_constant_in_switch: error
    # Downgrade style-only rules so they don't block CI
    directives_ordering: ignore
    prefer_const_constructors: ignore
    avoid_redundant_argument_values: ignore
    no_leading_underscores_for_local_identifiers: ignore
    prefer_const_declarations: ignore
    prefer_const_literals_to_create_immutables: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    annotate_overrides: true
    avoid_empty_else: true
    avoid_print: true
    avoid_unnecessary_containers: true
    eol_at_end_of_file: true
    no_duplicate_case_values: true
    sort_child_properties_last: true
    unnecessary_const: true
    unnecessary_new: true
    use_key_in_widget_constructors: true
