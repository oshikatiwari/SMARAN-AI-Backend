name: cognitive_care_games
description: >
  AI-Powered, Multilingual, Offline-First Cognitive Engagement Platform
  for Elderly/Dementia Care — Games Module (SIH 2026).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client for AI Backend Integration
  http: ^1.2.0

  # State Management
  flutter_riverpod: ^3.0.3

  # Game Engine
  flame: ^1.35.1

  # Local Persistence
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.3
  path: ^1.9.0

  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5

  # Localisation
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.3
  drift_dev: ^2.28.1
  riverpod_lint: ^3.0.3

  mockito: ^5.4.6

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
